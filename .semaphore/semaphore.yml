version: v1.0
name: "\U0001F31F Fan-In/Fan-Out Pipeline"
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
global_job_config:
  prologue:
    commands:
      - sem-version python 3.12
      - mkdir -p .pip_cache
      - python -m venv venv
blocks:
  - name: "\U0001F6E0️ Setup"
    dependencies: []
    task:
      jobs:
        - name: "\U0001F4E6 Install Dependencies"
          commands:
            - cache restore
            - echo "Checking out code..."
            - checkout
            - echo "Installing project dependencies..."
            - source venv/bin/activate
            - pip install pytest requests flask coverage locust
            - echo "Setup completed successfully!"
            - cache store
  - name: "\U0001F9EA Unit Tests"
    dependencies:
      - "\U0001F6E0️ Setup"
    task:
      jobs:
        - name: "\U0001F7E2 Run Unit Tests"
          commands:
            - source venv/bin/activate
            - echo "Running unit test suite..."
            - python test_math_sum.py
            - echo "Unit tests passed successfully!"
  - name: "\U0001F50D Integration Tests"
    dependencies:
      - "\U0001F6E0️ Setup"
    task:
      jobs:
        - name: "\U0001F504 Run Integration Tests"
          commands:
            - source venv/bin/activate
            - echo "Setting up test database..."
            - echo "Running integration tests..."
            - python test_integration.py
            - echo "Integration tests passed successfully!"
  - name: "\U0001F310 E2E Tests"
    dependencies:
      - "\U0001F6E0️ Setup"
    task:
      jobs:
        - name: "\U0001F3AD Run E2E app"
          commands:
            - echo "Starting test environment..."
            - cache restore
            - source venv/bin/activate
            - pip install -r requirements.txt
            - python app.py
        - name: "\U0001F3AD Run E2E Tests"
          commands:
            - echo "Running end-to-end tests..."
            - python test_e2e.py
            - echo "E2E tests passed successfully!"
  - name: ✨ Code Quality
    dependencies:
      - "\U0001F6E0️ Setup"
    task:
      jobs:
        - name: "\U0001F50D Lint"
          commands:
            - source venv/bin/activate
            - echo "Running code linting..."
            - echo "Linting passed successfully!"
        - name: "\U0001F4CA Type Check"
          commands:
            - echo "Running type checks..."
            - echo "Type checking passed successfully!"
  - name: "\U0001F510 Security"
    dependencies:
      - "\U0001F6E0️ Setup"
    task:
      jobs:
        - name: "\U0001F6E1️ Security Scan run app"
          commands:
            - source venv/bin/activate
            - echo "Scanning dependencies..."
            - echo "Running security checks..."
            - python ../4-e2e/app.py
        - name: "\U0001F6E1️ Security Scan run test"
          commands:
            - python test_security.py
            - echo "Security scan completed successfully!"
  - name: "\U0001F4E6 Build"
    dependencies:
      - "\U0001F9EA Unit Tests"
      - "\U0001F50D Integration Tests"
      - "\U0001F310 E2E Tests"
      - ✨ Code Quality
      - "\U0001F510 Security"
    task:
      jobs:
        - name: "\U0001F528 Build Production"
          commands:
            - source venv/bin/activate
            - echo "Building production assets..."
            - echo "Optimizing build..."
            - echo "Build completed successfully!"
  - name: "\U0001F680 Deploy"
    dependencies:
      - "\U0001F4E6 Build"
    task:
      jobs:
        - name: "\U0001F30D Deploy to Production"
          commands:
            - source venv/bin/activate
            - echo "Preparing deployment..."
            - echo "Running deployment checks..."
            - echo "Deploying to production..."
            - echo "Deployment completed successfully!"
