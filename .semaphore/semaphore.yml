version: v1.0
name: "\U0001F31F Fan-In/Fan-Out Pipeline"
agent:
  machine:
    type: f1-standard-4
    os_image: ubuntu2204
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
global_job_config:
  prologue:
    commands:
      - checkout
      - sem-version python 3.12
      - mkdir -p .pip_cache
blocks:
  - name: "\U0001F6E0️ Setup"
    dependencies: []
    task:
      jobs:
        - name: "\U0001F4E6 Install Dependencies"
          commands:
            - cache restore
            - echo "Checking out code..."
            - checkout
            - echo "Installing project dependencies..."
            - pip install pytest requests flask coverage locust
            - echo "Setup completed successfully!"
            - cache store
  - name: "\U0001F9EA Unit Tests"
    dependencies:
      - "\U0001F6E0️ Setup"
    task:
      jobs:
        - name: "\U0001F7E2 Run Unit Tests"
          commands:
            - cache restore
            - echo "Running unit test suite..."
            - cd 1-tdd && python -m pytest test_factorial.py -v
            - ls
            - cd ../2-unit-testing && python -m pytest test_math_sum.py -v
            - echo "Unit tests passed successfully!"
  - name: "\U0001F50D Integration Tests"
    dependencies:
      - "\U0001F9EA Unit Tests"
    task:
      jobs:
        - name: "\U0001F504 Run Integration Tests"
          commands:
            - cache restore
            - echo "Setting up test database..."
            - echo "Running integration tests..."
            - cd 3-integration-testing && python -m pytest test_integration.py -v
            - cd ../6-mocking && python -m pytest test_weather_service.py -v
            - cd ../10-database-testing && python -m pytest test_database.py -v
            - echo "Integration tests passed successfully!"
  - name: "\U0001F310 E2E Tests"
    dependencies:
      - "\U0001F50D Integration Tests"
    task:
      jobs:
        - name: "\U0001F3AD Run E2E test"
          commands:
            - echo "Starting test environment..."
            - cache restore
            - pip install -r requirements.txt
            - cd 4-e2e && nohup python app.py &
            - sleep 3
            - python -m pytest test_e2e.py -v
  - name: ✨ Test coverage
    dependencies:
      - "\U0001F310 E2E Tests"
    task:
      jobs:
        - name: "\U0001F50D Run Test coverage"
          commands:
            - echo "Running Test coverage."
  - name: "\U0001F510 Security testing"
    dependencies:
      - "\U0001F310 E2E Tests"
    task:
      jobs:
        - name: "\U0001F6E1️ Run Security test"
          commands:
            - echo "Running security test..."
  - name: "\U0001F4E6 Performance testing"
    dependencies:
      - "\U0001F310 E2E Tests"
    task:
      jobs:
        - name: Run Performance test
          commands:
            - echo "Run Performance test"
  - name: "\U0001F680 Test reports"
    dependencies:
      - ✨ Test coverage
      - "\U0001F4E6 Performance testing"
      - "\U0001F510 Security testing"
    task:
      jobs:
        - name: "\U0001F30D Create test report"
          commands:
            - echo "Create test report"
